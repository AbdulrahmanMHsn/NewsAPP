plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace "amhsn.newsapp"
    compileSdk 34

    defaultConfig {
        applicationId "amhsn.newsapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField("String", "BASE_URL", BASE_URL)
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion compose_version
        kotlinCompilerVersion '1.5.14'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation project(path: ':domain')
    implementation project(path: ':data')

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.compose.ui:ui:1.7.6"
    implementation "androidx.compose.material:material:1.7.6"
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.6"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.paging:paging-common-ktx:3.3.5'
    testImplementation 'junit:junit:+'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.7.6"
    debugImplementation "androidx.compose.ui:ui-tooling:1.7.6"

    // Icons
    implementation "androidx.compose.material:material-icons-core:1.7.6"
    implementation "androidx.compose.material:material-icons-extended:1.7.6"

    // Swipe refresh
    implementation "com.google.accompanist:accompanist-swiperefresh:0.20.2"

    // Splash Screen
    //noinspection GradleDependency
    implementation 'androidx.core:core-splashscreen:1.0.0-alpha01'

    // Navigation
    def navigation_version = '2.4.0-beta02'
    implementation "androidx.navigation:navigation-compose:2.8.5"


    // Constraint layout
    implementation "androidx.constraintlayout:constraintlayout-compose:1.1.0"

    // Coil
    implementation "io.coil-kt:coil-compose:1.3.2"

    def paging_version = '3.1.0'
    implementation "androidx.paging:paging-runtime-ktx:3.3.5"
    implementation "androidx.paging:paging-compose:3.3.5"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.49"
    kapt "com.google.dagger:hilt-compiler:2.48"
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    // Ktor
    def ktor_version = '1.6.5'
    implementation "io.ktor:ktor-client-android:1.6.5"
    implementation "io.ktor:ktor-client-serialization:1.6.5"
    implementation "io.ktor:ktor-client-logging-jvm:1.6.5"
    implementation "io.ktor:ktor-client-auth:1.6.5"

    def room_version = "2.2.3"
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    //noinspection GradleDependency
    implementation 'androidx.work:work-runtime-ktx:2.7.1'
}